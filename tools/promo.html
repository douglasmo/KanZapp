<!doctype html>
<!--
  Blocos promocionais da loja. Renderizado por tools/make-store-images.mjs em
  440x280 e 1400x560. O tamanho vem de `?w=&h=`; o layout se adapta.

  Sem imagem externa e sem fonte web: tudo desenhado em CSS/SVG, para a peça
  sair idêntica em qualquer máquina.
-->
<meta charset="utf-8">
<title>KanZapp — bloco promocional</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    background: #0b1a17;
    color: #fff;
    font-family: system-ui, "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 120% at 78% 8%, rgba(0, 208, 156, 0.30), transparent 60%),
      radial-gradient(70% 100% at 10% 100%, rgba(1, 122, 98, 0.42), transparent 62%),
      linear-gradient(150deg, #0d221d 0%, #0b1a17 55%, #071310 100%);
  }
  /* colunas fantasma: sugerem o kanban sem virar screenshot ilegível */
  .ghost { position: absolute; inset: 0; opacity: 0.14; overflow: hidden; }
  .ghost i {
    position: absolute;
    display: block;
    border-radius: 10px;
    background: #7cf0d3;
  }
  .content { position: relative; display: flex; align-items: center; gap: var(--gap); padding: 0 var(--pad); }
  .mark {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--markRadius);
    width: var(--markBox);
    height: var(--markBox);
    background:
      radial-gradient(120% 120% at 30% 18%, rgba(255, 255, 255, 0.24), transparent 60%),
      linear-gradient(155deg, #00c295, #017a62);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  }
  h1 { margin: 0; font-size: var(--title); font-weight: 750; letter-spacing: -0.02em; line-height: 1; }
  p { margin: var(--tagTop) 0 0; font-size: var(--tag); line-height: 1.32; color: #b9d8ce; max-width: var(--tagWidth); }
  .local {
    display: inline-block;
    margin-top: var(--badgeTop);
    padding: var(--badgePad);
    border-radius: 999px;
    font-size: var(--badge);
    font-weight: 650;
    color: #7cf0d3;
    background: rgba(0, 208, 156, 0.14);
    box-shadow: inset 0 0 0 1px rgba(124, 240, 211, 0.28);
  }
</style>
<div class="bg"></div>
<div class="ghost" id="ghost"></div>
<div class="content">
  <div class="mark">
    <svg id="mark" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
      <rect x="3" y="13.5" width="5" height="7" rx="2.5" opacity="0.5"></rect>
      <rect x="9.5" y="8.75" width="5" height="11.75" rx="2.5" opacity="0.75"></rect>
      <rect x="16" y="4" width="5" height="16.5" rx="2.5"></rect>
    </svg>
  </div>
  <div>
    <h1>KanZapp</h1>
    <p id="tag">Suas conversas do WhatsApp Web organizadas em um funil Kanban.</p>
    <span class="local">100% local · sem servidor</span>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const w = Number(params.get('w')) || 440;
  const h = Number(params.get('h')) || 280;
  const wide = w >= 1000;

  const root = document.documentElement.style;
  root.setProperty('--gap', wide ? '48px' : '20px');
  root.setProperty('--pad', wide ? '96px' : '28px');
  root.setProperty('--markBox', wide ? '190px' : '78px');
  root.setProperty('--markRadius', wide ? '46px' : '20px');
  root.setProperty('--title', wide ? '92px' : '38px');
  root.setProperty('--tag', wide ? '30px' : '14px');
  root.setProperty('--tagTop', wide ? '18px' : '8px');
  root.setProperty('--tagWidth', wide ? '760px' : '270px');
  root.setProperty('--badge', wide ? '22px' : '11px');
  root.setProperty('--badgeTop', wide ? '22px' : '10px');
  root.setProperty('--badgePad', wide ? '10px 20px' : '4px 10px');
  document.getElementById('mark').setAttribute('width', wide ? 108 : 44);
  document.getElementById('mark').setAttribute('height', wide ? 108 : 44);

  // no bloco pequeno o texto longo compete com a marca
  if (!wide) document.getElementById('tag').textContent = 'Seu funil Kanban dentro do WhatsApp Web.';

  // colunas fantasma ao fundo, proporcionais ao formato
  const ghost = document.getElementById('ghost');
  const cols = wide ? 5 : 4;
  const colW = wide ? 150 : 62;
  const gap = wide ? 26 : 12;
  const startX = w - (cols * (colW + gap)) + gap * 0.5;
  for (let c = 0; c < cols; c += 1) {
    const cards = 2 + ((c * 3) % 3);
    for (let k = 0; k < cards; k += 1) {
      const i = document.createElement('i');
      i.style.left = `${startX + c * (colW + gap)}px`;
      i.style.top = `${(wide ? 60 : 28) + k * (wide ? 96 : 44)}px`;
      i.style.width = `${colW}px`;
      i.style.height = `${wide ? 74 : 34}px`;
      i.style.opacity = String(1 - k * 0.22);
      ghost.appendChild(i);
    }
  }
  window.__shotReady = true;
</script>
